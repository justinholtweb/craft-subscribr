<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded tile: 22.44% radius, the house standard across these plugin icons -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#e58a32"/>
  <g fill="#fefefe">
    <!-- Binder posts. They stop inside the header, which is notched around them. -->
    <rect x="27.8" y="15.8" width="4.6" height="11.8" rx="2.3"/>
    <rect x="57.8" y="15.8" width="4.6" height="11.8" rx="2.3"/>
    <!-- Header. Split into a solid lower band and three upper segments rather than
         punched with holes, so the same geometry works unfilled in icon-mask.svg.
         Neighbouring pieces overlap by half a unit: shapes that only touch leave an
         anti-aliased hairline along the join. -->
    <rect x="17" y="29.5" width="57" height="6"/>
    <path d="M21 22h5.2v8H17V26a4 4 0 0 1 4-4z"/>
    <rect x="34" y="22" width="22.2" height="8"/>
    <path d="M64 22h6a4 4 0 0 1 4 4v4H64z"/>
    <!-- Body rails. The frame is open at the bottom; the right rail stops where the arrow crosses. -->
    <rect x="17" y="35" width="4" height="22.5"/>
    <rect x="70" y="35" width="4" height="7"/>
    <!-- Date cells on a 15 x 9.9 grid. The fourth is sliced by the arrow sweeping over it. -->
    <rect x="42" y="40" width="6.6" height="6.6"/>
    <rect x="57" y="40" width="6.6" height="6.6"/>
    <rect x="27" y="49.9" width="6.6" height="6.6"/>
    <path d="M42 49.9h6.6L44.6 56.5H42z"/>
    <!-- The renewal arrow: a tapered sweep off the grid into a solid head. -->
    <path d="M49.2 53.9q10.3-6.6 24.9-6v6.4q-14.1.3-24.9-.4z"/>
    <path d="M73.6 45.6 84.4 51.6 73.6 57.6z"/>
  </g>
  <!-- Three invoices, one per cycle. Outlines are stroked; folds and rules are filled. -->
  <g fill="none" stroke="#fefefe" stroke-width="1.4" stroke-linejoin="round">
    <path d="M18.9 61.7h9.4l5.3 5.3v14.3a1.2 1.2 0 0 1-1.2 1.2H18.9a1.2 1.2 0 0 1-1.2-1.2V62.9a1.2 1.2 0 0 1 1.2-1.2z"/>
    <path d="M42.9 61.7h9.4l5.3 5.3v14.3a1.2 1.2 0 0 1-1.2 1.2H42.9a1.2 1.2 0 0 1-1.2-1.2V62.9a1.2 1.2 0 0 1 1.2-1.2z"/>
    <path d="M66.9 61.7h9.4l5.3 5.3v14.3a1.2 1.2 0 0 1-1.2 1.2H66.9a1.2 1.2 0 0 1-1.2-1.2V62.9a1.2 1.2 0 0 1 1.2-1.2z"/>
  </g>
  <g fill="#fefefe">
    <path d="M27.8 62.2 33.1 67.5H27.8z"/>
    <path d="M51.8 62.2 57.1 67.5H51.8z"/>
    <path d="M75.8 62.2 81.1 67.5H75.8z"/>
    <rect x="20.2" y="70.8" width="10.9" height="1.4"/>
    <rect x="20.2" y="73.9" width="10.9" height="1.4"/>
    <rect x="20.2" y="77.0" width="10.9" height="1.4"/>
    <rect x="44.2" y="70.8" width="10.9" height="1.4"/>
    <rect x="44.2" y="73.9" width="10.9" height="1.4"/>
    <rect x="44.2" y="77.0" width="10.9" height="1.4"/>
    <rect x="68.2" y="70.8" width="10.9" height="1.4"/>
    <rect x="68.2" y="73.9" width="10.9" height="1.4"/>
    <rect x="68.2" y="77.0" width="10.9" height="1.4"/>
  </g>
</svg>
